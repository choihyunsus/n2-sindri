[package]
name = "n2-sindri"
version = "1.0.0"
edition = "2021"
rust-version = "1.98"
description = "AST-based code quality scanner for Rust, TypeScript, JavaScript, Python, Go and Java"
license = "MIT"
repository = "https://github.com/choihyunsus/n2-sindri"
include = ["src/**/*.rs", "tests/**/*.rs", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "README.ko.md", "CHANGELOG.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
regex = "1"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
